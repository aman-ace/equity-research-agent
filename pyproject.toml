[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equity-research-agent"
version = "0.2.0"
description = "An AI agent that researches public companies from SEC filings and writes a sourced equity research memo. Runs on Claude or Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aman Chandaliya", email = "amanchandaliya27@gmail.com" }]
keywords = ["equity-research", "sec-edgar", "claude", "gemini", "ai-agent", "finance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
# Only the data layer is required. Pick a model backend with an extra:
#   pip install -e ".[claude]"   or   pip install -e ".[gemini]"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
claude = ["anthropic>=0.69"]
gemini = ["google-genai>=1.0"]
# ruff is pinned to a compatible release: an unpinned linter means CI can install
# a newer version than the one changes were verified against and fail on style
# rules that did not exist at the time.
dev = ["anthropic>=0.69", "google-genai>=1.0", "pytest>=8.0", "ruff~=0.15.8"]

[project.urls]
Homepage = "https://github.com/aman-ace/equity-research-agent"
Issues = "https://github.com/aman-ace/equity-research-agent/issues"

[project.scripts]
equity-research = "equity_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
